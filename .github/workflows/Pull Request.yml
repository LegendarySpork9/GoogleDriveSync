name: CI on Pull Request

on:
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore dependencies
      run: nuget restore GoogleDriveSync.sln

    - name: Build solution
      run: msbuild GoogleDriveSync.sln /p:Configuration=Release

    - name: Run tests
      run: dotnet test "Google Drive Sync.Tests/Google Drive Sync.Tests.csproj" --configuration Release --no-build --verbosity normal
