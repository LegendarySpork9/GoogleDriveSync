name: CI on Pull Request

on:
  pull_request:
    branches:
      - '**'

permissions:
  statuses: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore dependencies
      run: nuget restore GoogleDriveSync.sln

    - name: Build solution
      run: msbuild GoogleDriveSync.sln /p:Configuration=Release

    - name: Run tests with coverage
      run: |
        dotnet test "Tests/Google Drive Sync.UnitTests/Google Drive Sync.UnitTests.csproj" --configuration Release --no-build --verbosity normal --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./TestResults
        dotnet test "Tests/Google Drive Sync.PersistenceTests/Google Drive Sync.PersistenceTests.csproj" --configuration Release --no-build --verbosity normal --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./TestResults
        dotnet test "Tests/Google Drive Sync.IntegrationTests/Google Drive Sync.IntegrationTests.csproj" --configuration Release --no-build --verbosity normal --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: reportgenerator -reports:"./TestResults/**/coverage.cobertura.xml" -targetdir:"./TestResults/CoverageReport" -reporttypes:"Cobertura;JsonSummary"

    - name: Post coverage status
      if: github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        COVERAGE=$(python3 -c "
        import json
        with open('./TestResults/CoverageReport/Summary.json') as f:
            data = json.load(f)
        print(round(data['summary']['linecoverage'], 1))
        ")

        echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

        echo "### Code Coverage" >> "$GITHUB_STEP_SUMMARY"
        echo "Line coverage: **${COVERAGE}%**" >> "$GITHUB_STEP_SUMMARY"

        gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
          -f state="success" \
          -f context="code-coverage" \
          -f description="Line coverage: ${COVERAGE}%" \
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./TestResults/CoverageReport/
